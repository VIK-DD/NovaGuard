name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Nothing here writes to the repository. The default GITHUB_TOKEN scope is
# whatever the repo/org setting says, which on older repositories is
# contents: write - a token a compromised dependency in a CI job could use
# to push to main. Declared explicitly so it does not depend on a setting
# that is invisible from the tree.
permissions:
  contents: read

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config by default,
          # and every job below then runs `pip install` or `npm ci` - install
          # scripts from hundreds of third-party packages, any one of which can
          # read a file. Nothing here pushes, so nothing here needs the token
          # to survive the checkout step.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q bot.py core cogs

      - name: Import smoke test
        run: python -c "import bot; print('cogs', len(bot.COGS))"

      - name: Test suite
        run: |
          python -m pip install pytest
          # The API smoke script starts a real server during import. Run it in
          # a fresh process so earlier test imports cannot cache its env config.
          python -m pytest tests --ignore=tests/test_webserver.py -q
          python tests/test_webserver.py

      - name: Security audit (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      # docs/SECURITY.md cites bandit as what holds up the "no eval/exec" and
      # SQL-injection rows. It was cited but never actually run, which is the
      # same class of mistake that table was rewritten to stop making.
      # Medium and above only: the low-severity findings here are asserts and
      # the games' use of `random`, both reviewed and deliberate.
      - name: Static security scan (bandit)
        run: |
          python -m pip install bandit
          bandit -q -r bot.py core cogs scripts tools --severity-level medium

  # The history is clean today and nothing was keeping it that way. Its own
  # job because it needs the full history, which the other jobs do not fetch.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Shape-based rather than entropy-based, and deliberately so: this tree
      # is full of high-entropy strings that are not secrets (CSP hashes,
      # --generate-hashes lines, Fernet fixtures). See scripts/scan_secrets.py.
      - name: Scan the working tree and every commit for credentials
        run: python scripts/scan_secrets.py --history

  # Proves the hash-locked lockfile installs reproducibly (what the Pi uses).
  locked-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's GITHUB_TOKEN in .git/config by default,
          # and every job below then runs `pip install` or `npm ci` - install
          # scripts from hundreds of third-party packages, any one of which can
          # read a file. Nothing here pushes, so nothing here needs the token
          # to survive the checkout step.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install from the hash-locked lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Import smoke test (locked versions)
        run: python -c "import bot; print('cogs', len(bot.COGS))"

      # Audit the artifact installed in production, not only the version ranges
      # in requirements.txt. A stale lock can otherwise pass the range audit.
      - name: Security audit (production lock)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock

      # A lock that has drifted below requirements.txt's own floors installs a
      # version the project has already rejected. It happened: Dependabot
      # raised the cryptography floor to 50.0.1 for a CVE and changed only
      # requirements.txt, so production kept installing 50.0.0 - and unlike
      # `npm ci`, `pip install --require-hashes` never checks the two agree.
      # Same shape as the CSP manifest check in the website job below:
      # regenerate, and fail if the committed file is not what comes out.
      - name: Confirm requirements.lock is in step with requirements.txt
        run: |
          python -m pip install uv
          uv pip compile --universal --generate-hashes \
            --python-version 3.11 -o /tmp/requirements.lock requirements.txt
          diff -u requirements.lock /tmp/requirements.lock

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website-3/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lives here as well as in the deploy workflow, and at a lower threshold.
      # Auditing only at deploy time meant a pull request could introduce a
      # vulnerable dependency and go green; the finding then appeared on main,
      # attached to whoever merged rather than whoever added it. `moderate`
      # rather than `high` because this gate blocks a review, not a release.
      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Test suite
        run: npx vitest run

      # build:launch verifies the permanent public-root artifact independently
      # from the date-aware Coming Soon overlay used by production deploys.
      # It also regenerates worker/inline-hashes.js, so a stale CSP manifest
      # fails the worker test above rather than reaching production.
      - name: Type-check and build
        run: npm run build:launch

      - name: Confirm the committed CSP hashes match the build
        run: git diff --exit-code -- worker/inline-hashes.js

      # The project's own security linter, run against the build being
      # reviewed. It used to run only in deploy-website.yml, twenty seconds
      # *after* the new version went live - so a secret baked into a bundle
      # was reported about a release already serving traffic. The live half
      # still runs there; this is the half that can gate a merge.
      - name: Security audit (build output)
        run: npm run security:audit:build
