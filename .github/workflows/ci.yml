name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q bot.py core cogs

      - name: Import smoke test
        run: python -c "import bot; print('cogs', len(bot.COGS))"

      - name: Test suite
        run: |
          python -m pip install pytest
          python -m pytest tests -q

      - name: Security audit (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  # Proves the hash-locked lockfile installs reproducibly (what the Pi uses).
  locked-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install from the hash-locked lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Import smoke test (locked versions)
        run: python -c "import bot; print('cogs', len(bot.COGS))"

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website-3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test suite
        run: npx vitest run

      # build:launch runs the archive sync first; it fails soft when the bot
      # API is unreachable from CI, so the committed archive is what gets baked.
      - name: Type-check and build
        run: npm run build:launch
