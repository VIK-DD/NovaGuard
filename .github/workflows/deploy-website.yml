name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - "website-3/**"
      - "core/release_versions.py"
      - "core/updates_archive.json"
  # Refresh the baked release archive even when a runtime update did not touch
  # website files. Live badges update immediately through /stats; detailed
  # release notes catch up here within an hour.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website-3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test suite
        run: npx vitest run

      # The Python side has had pip-audit in CI for a while; the Node side had
      # nothing, so a known vulnerability in astro, vite or anything they pull
      # in would have shipped unremarked. Checked before the build, so a bad
      # dependency never reaches the deploy step.
      #
      # high and critical only: moderate advisories in build-time tooling would
      # block deploys over code that never reaches a visitor, and a gate that
      # cries wolf gets switched off.
      - name: Dependency audit
        run: npm audit --audit-level=high

      # Must be the same build the maintainer runs locally. `build:launch`
      # skips scripts/soft-launch.mjs, and there is no src/pages/index.astro -
      # the site's root page exists *only* because soft-launch copies the
      # Coming Soon page onto dist/index.html. Deploying without it publishes
      # a site whose front door is a 404, silently replacing a good local
      # deploy on the next push to main.
      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website-3
          command: deploy

      # Audited here rather than anywhere else, because this is the only
      # machine with both halves: a freshly built dist/, which is what lets
      # route discovery find all sixteen pages instead of the five it can name
      # without one, and network reach to the site it has just published.
      #
      # The audit signs in through the soft-launch gate itself, so scanning
      # never requires opening the site to the public.
      - name: Wait for the edge to serve the new version
        run: sleep 20

      - name: Security audit
        env:
          NG_AUDIT_PASSWORD: ${{ secrets.NG_AUDIT_PASSWORD }}
        run: |
          # Without the password every gated page comes back unaudited and the
          # run would finish green having read almost nothing. A missing secret
          # is a broken check, not a clean site.
          if [ -z "$NG_AUDIT_PASSWORD" ]; then
            echo "::error::NG_AUDIT_PASSWORD is not set, so the gated pages cannot be audited."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npm run security:audit
