name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - "website-3/**"
      - "core/release_versions.py"
      - "core/updates_archive.json"
  # Refresh the baked release archive even when a runtime update did not touch
  # website files. Live badges update immediately through /stats; detailed
  # release notes catch up here within an hour.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website-3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test suite
        run: npx vitest run

      - name: Build
        run: npm run build:launch

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website-3
          command: deploy
