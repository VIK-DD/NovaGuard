version: 2
updates:
  # Python dependencies (requirements.txt)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"

  # The website's npm tree. This was missing entirely, so 680 packages -
  # astro, vite, esbuild, wrangler and everything under them - got no update
  # PRs at all. A new advisory surfaced only if it happened to be `high` and
  # somebody happened to deploy.
  - package-ecosystem: npm
    directory: "/website-3"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      # One PR for the build toolchain rather than six. These move together
      # and are reviewed together.
      astro-toolchain:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "vite"
          - "@tailwindcss/*"
          - "tailwindcss"
      # React requires react and react-dom to use the exact same version.
      # Keep the runtime and its type packages in one review so Dependabot
      # cannot silently leave the browser bundle on mismatched releases.
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        dependency-type: development
    ignore:
      # @astrojs/check 0.9.x currently supports TypeScript 5 and 6 only.
      # Keep accepting compatible updates and remove this ceiling once the
      # Astro checker publishes TypeScript 7 peer support.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"

  # GitHub Actions used in workflows (keeps the pinned SHAs current)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - ci
    commit-message:
      prefix: "ci"
