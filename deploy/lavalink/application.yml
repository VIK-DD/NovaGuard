server:
  port: 2333
  address: 127.0.0.1
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

  server:
    password: "CHANGE_ME_TO_A_LONG_RANDOM_PASSWORD"
    sources:
      youtube: false
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false

    # Filters the /filter presets need. A disabled filter is ignored silently
    # by the node, so the effect appears to apply and nothing changes.
    # distortion and channelMix stay off: no preset uses them, and every
    # enabled filter is more work the node may end up doing.
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: false
      vibrato: false
      distortion: false
      rotation: true
      channelMix: false
      lowPass: false

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 7
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 3

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - TV
      - ANDROID_VR
      - TVHTML5_SIMPLY
      - WEB
      - MWEB
      - WEBEMBEDDED

    # Leave OAuth off by default for the example config. If YouTube replies with
    # "This video requires login" from a VPS/Oracle IP, enable this on the live
    # node with a burner YouTube account and persist the printed refresh token.
    oauth:
      enabled: false
      # refreshToken: "paste the generated refresh token here"

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
